<!doctype html><html lang=en><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Time-stretch blind test</title>
<style>
 :root{color-scheme:dark}
 body{font:16px/1.6 system-ui,sans-serif;margin:0 auto;padding:1.5rem;max-width:40rem;background:#101114;color:#e8e8ea}
 h1{font-size:1.25rem;margin:0 0 .25rem} p.sub{color:#9a9aa2;margin:0 0 1.5rem}
 .card{background:#17181c;border:1px solid #26272d;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
 .row{display:flex;gap:.75rem;flex-wrap:wrap}
 button{font:inherit;padding:.8rem 1.1rem;border:1px solid #33343c;background:#1e1f25;color:#e8e8ea;border-radius:10px;cursor:pointer;flex:1 1 auto}
 button:hover{background:#26272e} button.on{border-color:#5ab0ff;background:#13243a}
 button.vote{min-width:6rem}
 .muted{color:#9a9aa2;font-size:.9rem}
 progress{width:100%;height:.35rem;margin:.5rem 0 1rem}
 #result{display:none} textarea{width:100%;height:7rem;background:#0c0d10;color:#9fe0a0;border:1px solid #26272d;border-radius:8px;font:13px ui-monospace,monospace;padding:.6rem}
 a{color:#5ab0ff}
</style>
<h1>Which one sounds better?</h1>
<p class=sub>Short music clips, each played at a different speed by two different programs. Headphones help.
No right answers — pick what sounds cleaner, or “same”.</p>
<div class=card id=test>
  <div class=muted id=head></div>
  <progress id=prog value=0 max=1></progress>
  <p class=muted id=busy></p>
  <div class=row>
    <button id=p1>▶ Play 1</button>
    <button id=p2>▶ Play 2</button>
    <button id=stop>■ Stop</button>
  </div>
  <p class=muted>They stay in sync — switching keeps your place in the music.</p>
  <div class="row">
    <button class=vote id=v1>1 better</button>
    <button class=vote id=vs>Same</button>
    <button class=vote id=v2>2 better</button>
  </div>
</div>
<div class=card id=result>
  <p><b>Done — thank you!</b> Copy the code below and send it back.</p>
  <textarea id=code readonly></textarea>
  <div class=row><button id=copy>Copy</button><button id=again>Start over</button></div>
</div>
<p class=muted id=credits></p>
<script>
const PAIRS = [{"a": "clips/00_rb3.flac", "b": "clips/00_ds.flac"}, {"a": "clips/01_ds.flac", "b": "clips/01_rb3.flac"}, {"a": "clips/00_ds.flac", "b": "clips/00_bungee.flac"}, {"a": "clips/02_ds.flac", "b": "clips/02_rb3.flac"}, {"a": "clips/06_bungee.flac", "b": "clips/06_ds.flac"}, {"a": "clips/03_rb3.flac", "b": "clips/03_ds.flac"}, {"a": "clips/02_bungee.flac", "b": "clips/02_ds.flac"}, {"a": "clips/09_rb3.flac", "b": "clips/09_ds.flac"}, {"a": "clips/05_ds.flac", "b": "clips/05_bungee.flac"}, {"a": "clips/11_ds.flac", "b": "clips/11_rb3.flac"}, {"a": "clips/07_ds.flac", "b": "clips/07_bungee.flac"}, {"a": "clips/07_rb3.flac", "b": "clips/07_ds.flac"}, {"a": "clips/04_ds.flac", "b": "clips/04_rb3.flac"}, {"a": "clips/10_rb3.flac", "b": "clips/10_ds.flac"}, {"a": "clips/04_ds.flac", "b": "clips/04_bungee.flac"}, {"a": "clips/05_rb3.flac", "b": "clips/05_ds.flac"}, {"a": "clips/11_ds.flac", "b": "clips/11_bungee.flac"}, {"a": "clips/08_bungee.flac", "b": "clips/08_ds.flac"}, {"a": "clips/10_bungee.flac", "b": "clips/10_ds.flac"}, {"a": "clips/03_ds.flac", "b": "clips/03_bungee.flac"}, {"a": "clips/08_ds.flac", "b": "clips/08_rb3.flac"}, {"a": "clips/09_bungee.flac", "b": "clips/09_ds.flac"}, {"a": "clips/06_ds.flac", "b": "clips/06_rb3.flac"}, {"a": "clips/01_bungee.flac", "b": "clips/01_ds.flac"}], CREDITS = [{"artist": "BLACK BOX", "title": "BLACK BOX - Totemism", "licence": "http://creativecommons.org/licenses/by/3.0/"}, {"artist": "Oleja Kaba", "title": "Hogus (Radio Edit)", "licence": "http://creativecommons.org/licenses/by-nc-nd/3.0/"}, {"artist": "XL Ant", "title": "No-Trace Land", "licence": ""}, {"artist": "Dj-Nen", "title": "Red Summer", "licence": "http://creativecommons.org/licenses/by-nd/3.0/"}, {"artist": "Igor Pumphonia", "title": "Igor Pumphonia - Going On", "licence": "http://creativecommons.org/licenses/by-nc-nd/3.0/"}, {"artist": "Becays", "title": "Pressures", "licence": "http://creativecommons.org/licenses/by-nc-sa/3.0/"}, {"artist": "KniPPi Fox", "title": "KniPPi Fox - Breath of Air ( No Vocal )", "licence": "http://creativecommons.org/licenses/by-sa/3.0/"}, {"artist": "DestructMarble250", "title": "Solfeyno", "licence": "http://creativecommons.org/licenses/by-nc-nd/3.0/"}, {"artist": "The.madpix.project", "title": "Go Away", "licence": "http://creativecommons.org/licenses/by-nc-nd/3.0/"}, {"artist": "Revolution Void", "title": "Factum par Fictio", "licence": "http://creativecommons.org/licenses/by-nc-nd/3.0/"}, {"artist": "Zeropage", "title": "Trance Etude 2", "licence": "http://creativecommons.org/licenses/by/3.0/"}, {"artist": "RunJoeRun", "title": "Loving This Beat Loving You (ext)", "licence": "http://creativecommons.org/licenses/by-nd/3.0/"}];
let i = 0, votes = JSON.parse(localStorage.getItem('abv') || '[]');
let ctx, buf = {}, src = null, gain = null, playing = 0, startedAt = 0, offset = 0, ready = false;
async function loadPair() {
  if (i >= PAIRS.length) return finish();
  $('head').textContent = `Clip ${i + 1} of ${PAIRS.length}`;
  $('prog').value = i / PAIRS.length;
  ready = false; setBusy('Laddar ljud…');
  ctx = ctx || new AudioContext();
  buf = {};
  try {
    for (const s of ['1', '2']) {
      const r = await fetch(PAIRS[i][s === '1' ? 'a' : 'b']);
      if (!r.ok) throw new Error(r.status + ' ' + PAIRS[i][s === '1' ? 'a' : 'b']);
      buf[s] = await ctx.decodeAudioData(await r.arrayBuffer());
    }
  } catch (e) {
    setBusy('Kunde inte ladda ljudet: ' + e.message + ' — ladda om sidan.');
    return;
  }
  ready = true; setBusy('');
}
function setBusy(msg) {                    /* empty msg = ready to play */
  $('busy').textContent = msg;
  for (const id of ['p1', 'p2', 'stop', 'v1', 'vs', 'v2']) $(id).disabled = !!msg;
}
async function play(side) {
  if (!ready || !buf[side]) return;
  if (ctx.state === 'suspended') await ctx.resume();   /* phones start the context suspended */
  const pos = playing ? (ctx.currentTime - startedAt + offset) % buf[side].duration : offset;
  stop(true);
  src = ctx.createBufferSource(); src.buffer = buf[side]; src.loop = true;
  gain = ctx.createGain(); src.connect(gain).connect(ctx.destination);
  src.start(0, pos); startedAt = ctx.currentTime; offset = pos; playing = side;
  $('p1').classList.toggle('on', side === '1'); $('p2').classList.toggle('on', side === '2');
}
function stop(keep) {
  if (src) { src.stop(); src.disconnect(); src = null; }
  if (gain) { gain.disconnect(); gain = null; }
  if (!keep) { offset = 0; playing = 0; $('p1').classList.remove('on'); $('p2').classList.remove('on'); }
}
async function vote(v) {
  if (!ready) return;
  stop();
  votes[i] = v; localStorage.setItem('abv', JSON.stringify(votes));
  i++; await loadPair();
}
function finish() {
  $('test').style.display = 'none'; $('result').style.display = 'block';
  $('code').value = JSON.stringify({ v: votes, n: PAIRS.length, t: new Date().toISOString().slice(0, 16) });
}
$('p1').onclick = () => play('1'); $('p2').onclick = () => play('2'); $('stop').onclick = () => stop();
$('v1').onclick = () => vote('1'); $('v2').onclick = () => vote('2'); $('vs').onclick = () => vote('same');
$('copy').onclick = () => { $('code').select(); document.execCommand('copy'); $('copy').textContent = 'Copied'; };
$('again').onclick = () => { votes = []; localStorage.removeItem('abv'); i = 0; $('result').style.display = 'none'; $('test').style.display = 'block'; loadPair(); };
addEventListener('keydown', e => { const k = e.key.toLowerCase();
  if (k === '1') play('1'); else if (k === '2') play('2'); else if (k === ' ') { e.preventDefault(); stop(); }
  else if (k === 'q') vote('1'); else if (k === 'w') vote('same'); else if (k === 'e') vote('2'); });
$('credits').innerHTML = 'Music: ' + CREDITS.map(c => `${c.artist} — ${c.title} (<a href="${c.licence}">CC</a>)`).join(' · ');
if (votes.length && votes.length < PAIRS.length) i = votes.length;
loadPair();
</script>
